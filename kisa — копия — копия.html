<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Viewer</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; background: #e2e8f0; font-family: sans-serif; margin: 0; padding: 12px; box-sizing: border-box; }
    
    /* MODIFIED: Single card container holding all elements together */
    #masterContentCard { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); width: 100%; max-width: 600px; box-sizing: border-box; display: none; flex-direction: column; }
    
    /* MODIFIED: Internal wrapping node for elements with an ultra-tight 4px gap */
    .inner-stack-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    
    /* NEW: Sleek visual border line to make stacked elements noticeable as you scroll */
    .stack-item { width: 100%; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
    .stack-item:not(:first-child) { border-top: 2px dashed #cbd5e1; padding-top: 8px; margin-top: 4px; }
    
    img, video { max-width: 100%; max-height: 80vh; width: auto; height: auto; object-fit: contain; border-radius: 4px; }
    audio { width: 100%; outline: none; }
    .text-box-render { width: 100%; border-left: 5px solid #6f42c1; padding: 12px; white-space: pre-wrap; font-size: 16px; line-height: 1.5; color: #24292e; word-break: break-word; background: #f8f9fa; border-radius: 0 4px 4px 0; box-sizing: border-box; }
    #error-state { font-size: 72px; color: #dc3545; display: none; text-align: center; margin-top: 40px; }
    #loading-spinner { display: block; width: 50px; height: 50px; border: 6px solid #e1e4e8; border-top: 6px solid #0366d6; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 40px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

    const shouldMuteVideo = true;

    function hideSpinner() {
      const spinner = document.getElementById('loading-spinner');
      if (spinner) spinner.style.display = 'none';
    }

    function showError() { document.getElementById('error-state').style.display = 'block'; }

    window.addEventListener('DOMContentLoaded', async () => {
      const savedPassword = localStorage.getItem('msg_decryption_key');
      if (savedPassword) { 
        await decryptAllItems(savedPassword); 
      } else { 
        hideSpinner(); showError(); 
      }
    });
    
    async function decryptAllItems(password) {
      try {
        const stackTarget = document.getElementById('cardStackTarget');
        
        for(let i = 0; i < payloadItems.length; i++) {
          const entry = payloadItems[i];
          const binaryStr = atob(entry.base64Data);
          const encryptedData = new Uint8Array(binaryStr.length);
          for (let j = 0; j < binaryStr.length; j++) { encryptedData[j] = binaryStr.charCodeAt(j); }
          
          const salt = encryptedData.subarray(0, 16);
          const iv = encryptedData.subarray(16, 28);
          const rawBytes = encryptedData.subarray(28);
          
          const enc = new TextEncoder();
          const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]);
          const key = await window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, rawBytes);
          
          // MODIFIED: Create a generic stack wrapper item to hold elements inside the single card
          const itemWrapper = document.createElement('div');
          itemWrapper.className = 'stack-item';

          if (entry.mediaType === 'text') {
            const txt = new TextDecoder().decode(decrypted);
            const textEl = document.createElement('div');
            textEl.className = 'text-box-render';
            textEl.innerText = txt;
            itemWrapper.appendChild(textEl);
          } else {
            const blob = new Blob([decrypted], { type: entry.mime });
            const dataUrl = await new Promise((res) => {
              const r = new FileReader();
              r.onload = (e) => res(e.target.result);
              r.readAsDataURL(blob);
            });

            if (entry.mediaType === 'audio') {
              const audio = document.createElement('audio');
              audio.controls = true; audio.src = dataUrl;
              itemWrapper.appendChild(audio);
            } else if (entry.mediaType === 'video') {
              const video = document.createElement('video');
              video.controls = true; video.src = dataUrl;
              if (shouldMuteVideo) { video.muted = true; video.setAttribute('muted', ''); }
              itemWrapper.appendChild(video);
            } else {
              const img = document.createElement('img');
              img.src = dataUrl;
              itemWrapper.appendChild(img);
            }
          }
          stackTarget.appendChild(itemWrapper);
        }
        
        hideSpinner();
        // MODIFIED: Reveal the single master card once all nested content is ready
        document.getElementById('masterContentCard').style.display = 'flex';
      } catch (e) {
        console.error(e); hideSpinner(); showError();
      }
    }
  </script>
