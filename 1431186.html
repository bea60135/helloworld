    const shouldMuteVideo = true;
    const shouldBlockAudioDl = true;

    function hideSpinner() { const spinner = document.getElementById('loading-spinner'); if (spinner) spinner.style.display = 'none'; }
    window.addEventListener('DOMContentLoaded', async () => {
      const savedPassword = localStorage.getItem('msg_decryption_key');
      if (savedPassword) { await decryptAllItems(savedPassword); } else { hideSpinner(); document.getElementById('error-state').style.display='block'; }
    });
    async function decryptAllItems(password) {
      try {
        const stackTarget = document.getElementById('cardStackTarget');
        for(let i = 0; i < payloadItems.length; i++) {
          const entry = payloadItems[i]; const binaryStr = atob(entry.base64Data); const encryptedData = new Uint8Array(binaryStr.length);
          for (let j = 0; j < binaryStr.length; j++) { encryptedData[j] = binaryStr.charCodeAt(j); }
          const salt = encryptedData.subarray(0, 16); const iv = encryptedData.subarray(16, 28); const rawBytes = encryptedData.subarray(28);
          const enc = new TextEncoder();
          const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]);
          const key = await window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, rawBytes);
          const itemWrapper = document.createElement('div'); itemWrapper.className = 'stack-item';
          if (entry.mediaType === 'text') {
            const textEl = document.createElement('div'); textEl.className = 'text-box-render'; textEl.innerText = new TextDecoder().decode(decrypted); itemWrapper.appendChild(textEl);
          } else {
            const blob = new Blob([decrypted], { type: entry.mime });
            const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = (e) => res(e.target.result); r.readAsDataURL(blob); });
            if (entry.mediaType === 'audio') {
              const audio = document.createElement('audio'); audio.controls = true; audio.src = dataUrl; 
              // REQUIREMENT 4: Strips standard context action items preventing user download access lines if checked
              if (shouldBlockAudioDl) { audio.setAttribute('controlsList', 'nodownload'); }
              itemWrapper.appendChild(audio);
            } else if (entry.mediaType === 'video') {
              const video = document.createElement('video'); video.controls = true; video.src = dataUrl; if (shouldMuteVideo) { video.muted = true; video.setAttribute('muted', ''); } itemWrapper.appendChild(video);
            } else {
              const img = document.createElement('img'); img.src = dataUrl; itemWrapper.appendChild(img);
            }
          }
          stackTarget.appendChild(itemWrapper);
        }
        hideSpinner(); document.getElementById('masterContentCard').style.display = 'flex';
      } catch (e) { console.error(e); hideSpinner(); document.getElementById('error-state').style.display='block'; }
