    #masterContentCard { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 600px; box-sizing: border-box; display: none; flex-direction: column; position: relative; }
    .inner-stack-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .stack-item { width: 100%; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
    .stack-item:not(:first-child) { padding-top: 8px; margin-top: 4px; }
    img, video { max-width: 100%; max-height: 80vh; width: auto; height: auto; object-fit: contain; border-radius: 4px; }
    audio { width: 100%; outline: none; }
    .text-box-render { width: 100%; border-left: 5px solid #6f42c1; padding: 12px; white-space: pre-wrap; font-size: 16px; line-height: 1.5; color: #24292e; background: #f8f9fa; border-radius: 0 4px 4px 0; box-sizing: border-box; }
    #error-state { font-size: 72px; color: #dc3545; display: none; text-align: center; margin-top: 40px; }
    #loading-spinner { display: block; width: 50px; height: 50px; border: 6px solid #e1e4e8; border-top: 6px solid #0366d6; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 40px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .scroller-guide-track {
      position: fixed; left: 4px; top: 0; width: 12px; height: 100vh;
      display: none; flex-direction: column;
      justify-content: space-around; align-items: center; pointer-events: none; z-index: 9999;
    }
    .indicator-arrow {
      color: #ff69b4; font-size: 20px; font-weight: 900;
      animation: pulseBounce 1.6s infinite ease-in-out; opacity: 0.8;
    }
    @keyframes pulseBounce {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(6px) scale(1.2); opacity: 1; }
    }

    const shouldMuteVideo = true;
    const shouldBlockAudioDl = true;
    const isMultiItem = false;

    function hideSpinner() { 
      const spinner = document.getElementById('loading-spinner'); 
      if (spinner) spinner.style.display = 'none'; 
    }
    
    window.addEventListener('DOMContentLoaded', async () => {
      const savedPassword = localStorage.getItem('msg_decryption_key');
      if (savedPassword) { 
        await decryptAllItems(savedPassword); 
      } else { 
        hideSpinner(); 
        document.getElementById('error-state').style.display='block'; 
      }
    });

    function evaluateScrollIndicators() {
      if (!isMultiItem) return;
      const track = document.getElementById('scrollTrack');
      if (!track) return;
      
      const hasOverflow = document.documentElement.scrollHeight > window.innerHeight;
      track.style.display = hasOverflow ? 'flex' : 'none';
    }

    window.addEventListener('resize', evaluateScrollIndicators);

    async function decryptAllItems(password) {
      try {
        const stackTarget = document.getElementById('cardStackTarget');
        for(let i = 0; i < payloadItems.length; i++) {
          const entry = payloadItems[i]; 
          const binaryStr = atob(entry.base64Data); 
          const encryptedData = new Uint8Array(binaryStr.length);
          for (let j = 0; j < binaryStr.length; j++) { 
            encryptedData[j] = binaryStr.charCodeAt(j); 
          }
          const salt = encryptedData.subarray(0, 16); 
          const iv = encryptedData.subarray(16, 28); 
          const rawBytes = encryptedData.subarray(28);
          const enc = new TextEncoder();
          const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]);
          const key = await window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, rawBytes);
          const itemWrapper = document.createElement('div'); 
          itemWrapper.className = 'stack-item';
          
          if (entry.mediaType === 'text') {
            const textEl = document.createElement('div'); 
            textEl.className = 'text-box-render'; 
            textEl.innerText = new TextDecoder().decode(decrypted); 
            itemWrapper.appendChild(textEl);
          } else {
            const blob = new Blob([decrypted], { type: entry.mime });
            const dataUrl = await new Promise((res) => { 
              const r = new FileReader(); 
              r.onload = (e) => res(e.target.result); 
              r.readAsDataURL(blob); 
            });
            if (entry.mediaType === 'audio') {
              const audio = document.createElement('audio'); 
              audio.controls = true; 
              audio.src = dataUrl; 
              if (shouldBlockAudioDl) { 
                audio.setAttribute('controlsList', 'nodownload'); 
              }
              itemWrapper.appendChild(audio);
            } else if (entry.mediaType === 'video') {
              const video = document.createElement('video'); 
              video.controls = true; 
              video.src = dataUrl; 
              if (shouldMuteVideo) { 
                video.muted = true; 
                video.setAttribute('muted', ''); 
              } 
              itemWrapper.appendChild(video);
            } else {
              const img = document.createElement('img'); 
              img.src = dataUrl; 
              img.onload = evaluateScrollIndicators;
              itemWrapper.appendChild(img);
            }
          }
          stackTarget.appendChild(itemWrapper);
        }
        hideSpinner(); 
        document.getElementById('masterContentCard').style.display = 'flex';
        setTimeout(evaluateScrollIndicators, 50);
      } catch (e) { 
        console.error(e); 
        hideSpinner(); 
        document.getElementById('error-state').style.display='block'; 
      }
    }
