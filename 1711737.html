  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; background: #e2e8f0; font-family: sans-serif; margin: 0; padding: calc(5mm + 12px) 12px 12px 20px; box-sizing: border-box; }
    #masterContentCard { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 600px; box-sizing: border-box; display: none; flex-direction: column; position: relative; }
    .inner-stack-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .stack-item { width: 100%; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
    .stack-item:not(:first-child) { padding-top: 8px; margin-top: 4px; }
    img, video { max-width: 100%; max-height: 80vh; width: auto; height: auto; object-fit: contain; border-radius: 4px; }
    audio { width: 100%; outline: none; }
    .text-box-render { width: 100%; border-left: 5px solid #6f42c1; padding: 12px; white-space: pre-wrap; font-size: 16px; line-height: 1.5; color: #24292e; background: #f8f9fa; border-radius: 0 4px 4px 0; box-sizing: border-box; }
    #error-state { font-size: 72px; color: #dc3545; display: none; text-align: center; margin-top: 40px; }
    #loading-spinner { display: block; width: 50px; height: 50px; border: 6px solid #e1e4e8; border-top: 6px solid #0366d6; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 40px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .scroller-guide-track {
      position: fixed; left: 4px; top: 0; width: 12px; height: 100vh;
      display: flex; flex-direction: column;
      justify-content: space-around; align-items: center; pointer-events: none; z-index: 9999;
    }
    .indicator-arrow {
      color: #ff69b4; font-size: 20px; font-weight: 900;
      animation: pulseBounce 1.6s infinite ease-in-out; opacity: 0.8;
    }
    @keyframes pulseBounce {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(6px) scale(1.2); opacity: 1; }
    }

              const video = document.createElement('video'); video.controls = true; video.src = dataUrl; if (shouldMuteVideo) { video.muted = true; video.setAttribute('muted', ''); } itemWrapper.appendChild(video);
            } else {
              const img = document.createElement('img'); img.src = dataUrl; itemWrapper.appendChild(img);
            }
          }
          stackTarget.appendChild(itemWrapper);
        }
        hideSpinner(); document.getElementById('masterContentCard').style.display = 'flex';
      } catch (e) { console.error(e); hideSpinner(); document.getElementById('error-state').style.display='block'; }
    }
