    const isAudioMedia = false; const isVideoMedia = false; const isTextMessage = false;
    const shouldMuteVideo = true;

    function hideSpinner() { const spinner = document.getElementById('loading-spinner'); if (spinner) spinner.style.display = 'none'; }
    window.addEventListener('DOMContentLoaded', () => {
      const savedPassword = localStorage.getItem('msg_decryption_key');
      if (savedPassword) { decryptMedia(savedPassword); } else { hideSpinner(); showError(); } 
    });
    function showError() { document.getElementById('error-state').style.display = 'block'; }
    async function decryptMedia(password) {
      try {
        const binaryStr = atob(encryptedDataBase64); const encryptedData = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) { encryptedData[i] = binaryStr.charCodeAt(i); }
        const salt = encryptedData.subarray(0, 16); const iv = encryptedData.subarray(16, 28); const rawBytes = encryptedData.subarray(28);
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]);
        const key = await window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, rawBytes);
        
        if (isTextMessage) {
          const txt = new TextDecoder().decode(decrypted); const txtContainer = document.getElementById('textViewer');
          txtContainer.innerText = txt; hideSpinner(); txtContainer.style.display = 'block';
        } else {
          const blob = new Blob([decrypted], { type: mediaMimeType }); const reader = new FileReader();
          reader.onload = function(e) { 
            if (isAudioMedia) {
              const audioPlayer = document.getElementById('audioViewer'); audioPlayer.src = e.target.result; hideSpinner(); audioPlayer.style.display = 'block'; 
            } else if (isVideoMedia) {
              const videoPlayer = document.getElementById('videoViewer'); if (shouldMuteVideo) { videoPlayer.muted = true; videoPlayer.setAttribute('muted', ''); }
              videoPlayer.src = e.target.result; hideSpinner(); videoPlayer.style.display = 'block'; 
            } else {
              const imagePlayer = document.getElementById('viewer'); imagePlayer.src = e.target.result; hideSpinner(); imagePlayer.style.display = 'block'; 
            }
          };
          reader.readAsDataURL(blob);
        }
      } catch (e) { console.error(e); hideSpinner(); showError(); }
    }
